<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slap Me 😤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff0f3; --bg2:#ffe3ec; --card:#ffffff; --text:#4a2436;
    --sub:#9a5872; --pink:#ff4d79; --pink-dark:#e8265a;
    --redmark:#ff3355; --tear:#6ec8ff;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#2a0f1c; --bg2:#3a1526; --card:#3a1726; --text:#ffe3ec;
      --sub:#f3a6c0; --pink:#ff6690; --pink-dark:#ff3f74;
      --redmark:#ff4d6d; --tear:#6ec8ff; color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; font-family:'Poppins', ui-sans-serif, system-ui, sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2)); color:var(--text);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  .wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 18px;}
  .card{width:100%; max-width:400px; background:var(--card); border-radius:28px; box-shadow:0 10px 30px rgba(230,50,100,.18); padding:28px 22px 32px; text-align:center;}
  h1{font-family:'Dancing Script', cursive; font-size:1.8rem; color:var(--pink-dark); margin:0 0 4px;}
  p.sub{color:var(--sub); font-size:.88rem; margin:0 0 18px;}

  .sticker{width:190px; height:190px; margin:0 auto 8px; position:relative; transition:transform .08s;}
  .sticker.shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:rotate(0);} 20%{transform:rotate(-9deg) translateX(-6px);}
    40%{transform:rotate(7deg) translateX(6px);} 60%{transform:rotate(-5deg) translateX(-4px);}
    80%{transform:rotate(3deg) translateX(3px);}
  }
  .sticker img{width:100%; height:100%; object-fit:cover; border-radius:50%; border:5px solid #fff; box-shadow:0 8px 20px rgba(230,50,100,.3); display:block;}
  .mark{position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle, var(--redmark) 0%, transparent 70%); opacity:0; pointer-events:none;}
  .mark.show{animation:flash .4s ease;}
  @keyframes flash{0%{opacity:0;} 45%{opacity:.6;} 100%{opacity:0;}}

  .tear{position:absolute; width:8px; height:16px; background:var(--tear); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; opacity:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
  .tear.l{left:33%; top:46%;} .tear.r{left:58%; top:44%;}
  .tear.show{animation:fall 0.8s ease forwards;}
  @keyframes fall{0%{opacity:0; transform:translateY(0);} 25%{opacity:1;} 100%{opacity:0; transform:translateY(38px);}}

  .msg{font-size:1rem; font-weight:600; min-height:1.4em; margin:14px 0 18px;}
  .btn-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{border:none; border-radius:999px; padding:12px 24px; font-size:.95rem; font-weight:600; cursor:pointer; font-family:inherit; color:#fff; transition:transform .1s;}
  .btn:active{transform:scale(.93);}
  .btn-slap{background:var(--pink); box-shadow:0 8px 16px rgba(255,77,121,.3);}
  .btn-beat{background:#ff7a3d; box-shadow:0 8px 16px rgba(255,122,61,.3);}
  .counter{margin-top:20px; font-size:.95rem; color:var(--sub);}
  .counter b{color:var(--pink-dark); font-size:1.3rem;}
</style>
</head>

    <div class="msg" id="msg">&nbsp;</div>
    <div class="btn-row">
      <button class="btn btn-slap" id="slapBtn">Slap 👋</button>
      <button class="btn btn-beat" id="beatBtn">Beat 🤛</button>

</div>

<script>
  const sticker = document.getElementById('sticker');
  const mark = document.getElementById('mark');
  const tearL = document.getElementById('tearL');
  const tearR = document.getElementById('tearR');
  const msg = document.getElementById('msg');
  const countEl = document.getElementById('count');
  const pluralEl = document.getElementById('plural');

  const slapLines = ["ow 😖", "okay I deserved that", "I'm sorry!!", "that one hurt a little", "still love you though 🥲"];
  const beatLines = ["OW okay okay", "I'm really sorry", "feel better?", "I'll do better, promise", "go easy on me 😭"];

  // shared counter synced across every device that opens this page
  const NAMESPACE = "sriman-keerthi-love-2026";
  const KEY = "slaps";
  let count = 0;

  function setCountDisplay(n){
    count = n;
    countEl.textContent = count;
    pluralEl.textContent = count === 1 ? "" : "s";
  }

  async function loadCount(){
    try{
      const res = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${KEY}`);
      const data = await res.json();
      setCountDisplay(data.value || 0);
    }catch(e){ /* offline fallback: stays at 0 shown locally */ }
  }
  loadCount();

  async function bumpCount(){
    try{
      const res = await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${KEY}`);
      const data = await res.json();
      setCountDisplay(data.value);
    }catch(e){
      setCountDisplay(count + 1); // local fallback if offline
    }
  }

  function hit(lines){
    bumpCount();
    msg.textContent = lines[Math.floor(Math.random() * lines.length)];

    sticker.classList.remove('shake'); void sticker.offsetWidth; sticker.classList.add('shake');
    mark.classList.remove('show'); void mark.offsetWidth; mark.classList.add('show');
    tearL.classList.remove('show'); void tearL.offsetWidth; tearL.classList.add('show');
    tearR.classList.remove('show'); void tearR.offsetWidth; tearR.classList.add('show');
  }

  document.getElementById('slapBtn').addEventListener('click', () => hit(slapLines));
  document.getElementById('beatBtn').addEventListener('click', () => hit(beatLines));
</script>
